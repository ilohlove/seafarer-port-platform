name: Deploy Seafarer Port Notes

on:
  push:
    branches:
      - agent/seafarer-port-notes-pivot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-seafarer-port-notes
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Ubuntu Nginx
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks and build
        run: npm run check

      - name: Verify built port data
        run: |
          test -f dist/data/port-master/manifest.json
          node scripts/port-data/check-port-data.mjs --root dist/data/port-master

      - name: Publish dist to Nginx root
        run: |
          rsync -a --delete dist/ /var/www/seafarer-port-platform/app/seafarer-port-platform/dist/

      - name: Verify deployed port data
        run: |
          node scripts/port-data/check-port-data.mjs --root /var/www/seafarer-port-platform/app/seafarer-port-platform/dist/data/port-master
          served_manifest="$(mktemp)"
          trap 'rm -f "$served_manifest"' EXIT
          curl -fsS -H 'Cache-Control: no-cache' http://localhost/data/port-master/manifest.json -o "$served_manifest"
          cmp -s dist/data/port-master/manifest.json "$served_manifest"

      - name: Smoke test
        run: |
          curl -fsSI http://localhost/
          curl -fsSI http://localhost/ports/busan
          curl -fsSI http://localhost/data/port-master/manifest.json
